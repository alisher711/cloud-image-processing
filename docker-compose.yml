x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: images
  POSTGRES_USER: imageuser
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: imageuser
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  DATA_DIR: /data

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: images
      POSTGRES_USER: imageuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imageuser -d images"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: imageuser
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: cip-api:dev
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - imagedata:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: cip-worker:dev
    environment:
      <<: *app-env
      PROCESSING_DELAY_SECONDS: "2"
    volumes:
      - imagedata:/data
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  rabbitdata:
  imagedata: