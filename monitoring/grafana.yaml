apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  cip.json: |
    {
      "uid": "cip-overview",
      "title": "Image Processing Service",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Workers up", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "expr": "count(up{job='worker'} == 1)"}]},
        {"id": 2, "type": "stat", "title": "Queue length", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "expr": "max(imgproc_queue_length)"}]},
        {"id": 3, "type": "stat", "title": "Busy workers", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "expr": "sum(worker_busy)"}]},
        {"id": 4, "type": "stat", "title": "Completed jobs (total)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}, "targets": [{"refId": "A", "expr": "max(imgproc_jobs{status='completed'})"}]},
        {"id": 5, "type": "timeseries", "title": "Queue length over time", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "max(imgproc_queue_length)", "legendFormat": "queued"}]},
        {"id": 6, "type": "timeseries", "title": "Throughput (jobs/min)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "sum(rate(worker_jobs_total{outcome='completed'}[1m])) * 60", "legendFormat": "completed/min"}]},
        {"id": 7, "type": "timeseries", "title": "Jobs by status", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "max by (status) (imgproc_jobs)", "legendFormat": "{{status}}"}]},
        {"id": 8, "type": "timeseries", "title": "Avg processing time per job (s)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "sum(rate(worker_job_duration_seconds_sum[1m])) / sum(rate(worker_job_duration_seconds_count[1m]))", "legendFormat": "avg"}]},
        {"id": 9, "type": "timeseries", "title": "Worker CPU (cores)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "sum by (instance) (rate(process_cpu_seconds_total{job='worker'}[1m]))", "legendFormat": "{{instance}}"}]},
        {"id": 10, "type": "timeseries", "title": "Worker memory", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "targets": [{"refId": "A", "expr": "process_resident_memory_bytes{job='worker'}", "legendFormat": "{{instance}}"}]},
        {"id": 11, "type": "timeseries", "title": "API p95 latency (s)", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 28, "w": 24, "h": 8}, "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job='api'}[1m])))", "legendFormat": "p95"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GRAFANA_PASSWORD
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"            # demo only: anyone can view dashboards
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/cip.json
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030